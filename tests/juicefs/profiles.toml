# 計測・再生の試験の対象プロファイル（固定値）。接続の URL や鍵はここに書かない（実行時に mount スクリプトから読む）。

[prod]
metrics_url = "http://127.0.0.1:9567/metrics"
inode = 634040
cache_dir = "~/.juicefs/cache/73e74f7b-6f95-4155-adea-d9ef1e669c20"
mountpoint = "~/mnt_juicefs"
redis_source = "mount_script"
redis_addr = ""
log_glob = "~/.juicefs/diagnostics/vm-io-*.log"
bucket = "buckets"

[test]
metrics_url = "http://127.0.0.1:9568/metrics"
inode = 0
cache_dir = "~/.juicefs/cache-test"
mountpoint = "~/mnt_juicefs_test"
redis_source = "test"
redis_addr = "127.0.0.1:16379"
redis_db = 1
log_glob = "~/.juicefs/test-suite/juicefs.log"
bucket = "juicefs-kaz-test"

# 試験の volume 用の資源と上限
[common]
redis_compose_file = "replay/docker-compose.yml"  # 試験の Redis の compose（tests/juicefs からの相対）
redis_compose_project = "jfs-kaz-test"  # 固定の project 名（他の compose と衝突させない）
test_binary = "~/.local/bin/kaz-test/juicefs-delta-7336466c"
rtt_proxy_addr = "127.0.0.1:16380"
rtt_one_way_ms = 5
seed_limit_gib = 32
settle_seconds = 60
settle_max_seconds = 600
object_error_tolerance = 20  # 試験の PUT／GET の誤りのうち、retire（abandoned）で説明できない誤りの許容数（超えたら止める）。JuiceFS が再試行する 1 回だけの時間切れ（Drive の応答待ち 30 秒など）で止めないため 20 にした（2026-10-21、実走で確認）
object_errors_stop = false  # PUT／GET の 1 回ごとの失敗（Drive の応答待ちの時間切れなど。JuiceFS が再試行する）で止めるか。2026-10-21 の実走で apt upgrade の間に 21 件出て止まったので false にした。rate limit・EIO・mount の停止・本番の誤りの増加では今までどおり止める
replay_procs_max = 64  # 流し直しの worker の process の数の上限（記録の pid をこの数に分ける。1 process の pid が多いと GIL の取り合いで待ちが膨らむ）
abandon_window_seconds = 30  # PUT の誤りの後、同じ key の `is not needed, abandoned` を待つ秒数
loss_tolerance = 0.01
interval_metrics_s = 60
interval_llen_s = 600
interval_cache_churn_s = 300
